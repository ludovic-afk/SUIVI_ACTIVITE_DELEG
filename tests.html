<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests</title><link rel="stylesheet" href="styles.css"><main><h1>Tests</h1><button id="run">Lancer les tests</button><div id="out"></div><h2>Tests manuels</h2><ol><li>Navigation complète au clavier.</li><li>Affichage à 320 px.</li><li>Export Excel et contrôle des 26 colonnes.</li><li>Test hors connexion après chargement.</li></ol></main><script src="config.js"></script><script src="delegations.js"></script><script src="actions.js"></script><script src="security-service.js"></script><script src="storage-service.js"></script><script src="validation-service.js"></script><script>run.onclick=()=>{let t=[["6 délégations",DELEGATIONS.length===6],["26 colonnes",CFG.cols.length===26],["Code Isérois",DELEGATIONS.find(x=>x.nom==="Isérois").code==="DARA38"],["Code scolaire",ACTIONS[0].code==="T1SENSI_SCOLAIR"],["Refus négatif",Validate.record({actionId:"x",delegation:"x",month:"x",estab:"x",code:"x",m:[0,0,1],adherents:-1}).length>0],["Protection formule",Security.excel("=1+1").startsWith("'")]];out.innerHTML=t.map(x=>`<p class="${x[1]?"success":"error"}">${x[1]?"✓":"✗"} ${x[0]}</p>`).join("")}</script></html>
